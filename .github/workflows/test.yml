name: Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # Install the channels the projects target and let global.json pick
          # the SDK. The global-json-file input cannot do this: with
          # rollForward latestMajor it resolves to the LTS channel, which does
          # not include .NET 11. The .NET 10 SDK also provides the runtime that
          # runs the net10.0 tests.
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build, test and package
        run: .\build.cmd
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: fitSharp-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # Install the channels the projects target and let global.json pick
          # the SDK. The global-json-file input cannot do this: with
          # rollForward latestMajor it resolves to the LTS channel, which does
          # not include .NET 11. The .NET 10 SDK also provides the runtime that
          # runs the net10.0 tests.
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Build and test
        run: ./build.sh
