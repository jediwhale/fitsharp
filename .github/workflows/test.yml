name: Tests

on: [push]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET Core SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.X
            9.0.X
            10.0.X
            11.0.X
      - name: Build, test and package
        run: .\build.cmd
