name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      # Required for the OIDC token that nuget.org exchanges for a temporary API key.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
      - name: Validate the version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = $properties.Project.PropertyGroup.Version
          $pattern = '^\d{4}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12]\d|3[01])(?:-(?:alpha|beta|rc)\.[1-9]\d*)?$'
          if ($version -notmatch $pattern) {
            throw "Version '$version' must match YYYY.M.D or YYYY.M.D-{alpha|beta|rc}.N."
          }
          $date = $version.Split('-')[0]
          try {
            [void][datetime]::ParseExact($date, 'yyyy.M.d', [System.Globalization.CultureInfo]::InvariantCulture)
          }
          catch {
            throw "Version '$version' does not contain a valid date."
          }
      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          [xml]$properties = Get-Content Directory.Build.props
          $version = $properties.Project.PropertyGroup.Version
          if ('${{ github.ref_name }}' -ne $version) {
            throw "Tag '${{ github.ref_name }}' does not match version '$version' in Directory.Build.props."
          }
      - name: Build, test and pack
        run: .\build.cmd
      - name: Exchange the OIDC token for a temporary NuGet API key
        if: github.event_name == 'push'
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name of whoever created the trusted publishing policy.
          user: ${{ secrets.NUGET_USER }}
      - name: Publish package and symbols
        if: github.event_name == 'push'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
            throw 'No temporary NuGet API key was issued.'
          }
          if (-not (Test-Path artifacts\*.snupkg)) {
            throw 'The symbols package is missing from artifacts.'
          }
          # The symbols package next to the package is pushed to the symbol source as part of this command.
          dotnet nuget push artifacts\*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            throw "Push failed with exit code $LASTEXITCODE."
          }
